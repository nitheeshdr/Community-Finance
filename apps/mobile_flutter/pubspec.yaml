name: finance
description: "Community Finance — Flutter"
publish_to: 'none'
version: 1.6.0+6

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Secure token storage (Keychain / Keystore)
  flutter_secure_storage: ^9.2.4

  # Utilities
  intl: ^0.20.1

  # Open Razorpay hosted payment links in the browser
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
